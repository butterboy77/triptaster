name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Docker image builds and starts
        run: |
          docker build -t triptaster:ci .
          docker run -d --name tt -e BASE_URL=http://localhost:3000 -p 3000:3000 triptaster:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/healthz && break; sleep 1; done
          curl -fs http://localhost:3000/api/auth/status | grep -q '"setupRequired":true'
          docker logs tt | grep -qE '[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}'
